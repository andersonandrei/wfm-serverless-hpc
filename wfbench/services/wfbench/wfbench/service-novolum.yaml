apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wfbench
  namespace: knative-functions
spec:
  template:
    spec:
      containers:
      - name: wfbench
        image: docker.io/andersonandrei/wfbench-knative:wfbench
        resources:  
          requests:
            cpu: 1
            memory: 1024M
          limits:
            cpu: 1
            memory: 1024M               
